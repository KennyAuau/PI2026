<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavil</title>
    <link rel="icon" type="image/x-icon" href="imagens/pavil logo.png">
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome para Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0d1b38 0%, #050a17 60%, #02040a 100%);
      --card-bg: rgba(12, 23, 48, 0.75);
      --card-border: rgba(212, 175, 55, 0.35);
      --card-glow: rgba(0, 168, 255, 0.2);
      
      --gold: #f3d078;
      --gold-dark: #c59b27;
      --gold-glow: rgba(243, 208, 120, 0.4);
      
      --evil-eye-blue: #00429d;
      --evil-eye-cyan: #00d4ff;
      --evil-eye-dark: #001233;
      
      --text-bright: #ffffff;
      --text-muted: #a3b8cc;
      
      --danger: #ff5555;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-bright);
      min-height: 100vh;
      padding: 30px 15px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo místico */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 100px 150px, #f3d078, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 200px 80px, #00d4ff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 350px 250px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
    }

    /* Botão Voltar no canto superior esquerdo */
    .btn-back {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      background: rgba(12, 23, 48, 0.8);
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 1.2rem;
      text-decoration: none;
      box-shadow: 0 0 10px var(--card-glow);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .btn-back:hover {
      background: var(--gold);
      color: var(--evil-eye-dark);
      transform: scale(1.1);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .evil-eye-main {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6));
      animation: pulseEye 4s infinite ease-in-out;
    }

    @keyframes pulseEye {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 25px rgba(243, 208, 120, 0.8)); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--gold-glow);
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-style: italic;
    }

    /* Painel Glassmorphism */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px var(--card-glow);
      margin-bottom: 30px;
      position: relative;
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 10px;
    }

    /* Formulário Topo */
    .wish-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
    }

    input, select {
      background: rgba(5, 12, 28, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    select option {
      background: #081226;
      color: #fff;
    }

    .btn-add {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #00429d 0%, #00d4ff 100%);
      color: #fff;
      border: 1px solid var(--gold);
      padding: 14px;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5), 0 0 10px var(--gold-glow);
      background: linear-gradient(135deg, #00d4ff 0%, #00429d 100%);
    }

    /* Barra de Estatísticas & Filtros */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stats span {
      color: var(--gold);
      font-weight: bold;
    }

    .filter-select {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    /* Lista de Desejos */
    .wish-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .wish-card {
      background: rgba(8, 18, 38, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(5px);
    }

    .wish-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 212, 255, 0.2);
    }

    .wish-card.completed {
      opacity: 0.65;
      border-color: rgba(0, 230, 118, 0.3);
      background: rgba(5, 25, 20, 0.5);
    }

    .wish-card.completed .wish-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }

    .wish-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
    }

    .category-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: var(--evil-eye-cyan);
      white-space: nowrap;
    }

    .price-tag {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 15px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
      margin-top: 10px;
    }

    .btn-action-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .action-btn.edit:hover {
      background: rgba(243, 208, 120, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .action-btn.delete:hover {
      background: rgba(255, 85, 85, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .action-btn.check {
      width: auto;
      padding: 0 10px;
      gap: 6px;
      font-size: 0.8rem;
    }

    .action-btn.check:hover {
      background: rgba(0, 230, 118, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    .wish-card.completed .action-btn.check {
      background: rgba(0, 230, 118, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    /* Estado Vazio */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state i {
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* Modal de Edição */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 4, 10, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      width: 100%;
      max-width: 500px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .close-modal:hover {
      color: var(--danger);
    }

    /* Responsividade */
    @media (max-width: 650px) {
      .wish-form {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.7rem;
      }
      .btn-back {
        top: 15px;
        left: 15px;
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Seta no canto superior para voltar para perfil.html -->
  <a href="perfi.html" class="btn-back" title="Voltar ao Perfil">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <div class="container">
    
    <!-- Cabeçalho Místico -->
    <header>
      <svg class="evil-eye-main" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#f3d078" stroke-width="2"/>
        <circle cx="50" cy="50" r="36" fill="#00429d"/>
        <circle cx="50" cy="50" r="22" fill="#00d4ff"/>
        <circle cx="50" cy="50" r="10" fill="#001233"/>
        <circle cx="46" cy="46" r="3" fill="#ffffff"/>
      </svg>
      <h1>Grimório dos Desejos</h1>
      <p class="subtitle">Que a energia do Olho Grego proteja e manifeste as tuas intenções</p>
    </header>

    <!-- Container Superior: Adicionar Produto -->
    <div class="glass-panel">
      <div class="panel-title">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Manifestar Novo Desejo</span>
      </div>
      
      <form id="wishForm" class="wish-form">
        <div class="form-group full-width">
          <label for="productName">Nome do Produto / Objeto</label>
          <input type="text" id="productName" placeholder="Ex: Cristal de Ametista" required>
        </div>

        <div class="form-group">
          <label for="productCategory">Categoria</label>
          <select id="productCategory">
            <option value="Acessórios">Acessórios</option>
            <option value="Baralho de Tarot">Baralho de Tarot</option>
            <option value="Cristais">Cristais</option>
            <option value="Incensário">Incensário</option>
            <option value="Incenso">Incenso</option>
            <option value="Livros">Livros</option>
            <option value="Ordem Paranormal">Ordem Paranormal</option>
            <option value="Velas">Velas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productPrice">Valor Estimado (R$)</label>
          <input type="number" id="productPrice" step="0.01" min="0" placeholder="0,00">
        </div>

        <button type="submit" class="btn-add">
          <i class="fa-solid fa-eye"></i> Consagrar à Lista
        </button>
      </form>
    </div>

    <!-- Filtros e Contador -->
    <div class="controls-bar">
      <div class="stats">
        Total: <span id="totalItems">0</span> itens | 
        Valor Estimado: <span id="totalValue">R$ 0,00</span>
      </div>

      <select id="filterCategory" class="filter-select">
        <option value="all">Todas as Categorias</option>
        <option value="Acessórios">Acessórios</option>
        <option value="Baralho de Tarot">Baralho de Tarot</option>
        <option value="Cristais">Cristais</option>
        <option value="Incensário">Incensário</option>
        <option value="Incenso">Incenso</option>
        <option value="Livros">Livros</option>
        <option value="Ordem Paranormal">Ordem Paranormal</option>
        <option value="Velas">Velas</option>
      </select>
    </div>

    <!-- Container Inferior: Lista de Desejos Exibida -->
    <div id="wishList" class="wish-list">
      <!-- Cards serão gerados dinamicamente via JS -->
    </div>

  </div>

  <!-- Modal de Edição -->
  <div id="editModal" class="modal-overlay">
    <div class="glass-panel modal">
      <div class="modal-header">
        <div class="panel-title" style="margin-bottom:0; border:none;">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>Editar Desejo</span>
        </div>
        <button id="closeModal" class="close-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="editForm" class="wish-form">
        <input type="hidden" id="editId">
        
        <div class="form-group full-width">
          <label for="editProductName">Nome do Produto</label>
          <input type="text" id="editProductName" required>
        </div>

        <div class="form-group">
          <label for="editProductCategory">Categoria</label>
          <select id="editProductCategory">
            <option value="Acessórios">Acessórios</option>
            <option value="Baralho de Tarot">Baralho de Tarot</option>
            <option value="Cristais">Cristais</option>
            <option value="Incensário">Incensário</option>
            <option value="Incenso">Incenso</option>
            <option value="Livros">Livros</option>
            <option value="Ordem Paranormal">Ordem Paranormal</option>
            <option value="Velas">Velas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editProductPrice">Valor Estimado (R$)</label>
          <input type="number" id="editProductPrice" step="0.01" min="0">
        </div>

        <button type="submit" class="btn-add">
          <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
        </button>
      </form>
    </div>
  </div>

  <!-- Script da Aplicação -->
  <script>
    const STORAGE_KEY = 'grimorio_desejos_lista';
    let wishes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Elementos do DOM
    const wishForm = document.getElementById('wishForm');
    const wishList = document.getElementById('wishList');
    const totalItemsEl = document.getElementById('totalItems');
    const totalValueEl = document.getElementById('totalValue');
    const filterCategory = document.getElementById('filterCategory');

    // Elementos do Modal
    const editModal = document.getElementById('editModal');
    const closeModalBtn = document.getElementById('closeModal');
    const editForm = document.getElementById('editForm');

    // Eventos
    document.addEventListener('DOMContentLoaded', renderWishes);
    wishForm.addEventListener('submit', handleAddWish);
    filterCategory.addEventListener('change', renderWishes);
    closeModalBtn.addEventListener('click', hideModal);
    editForm.addEventListener('submit', handleEditSave);

    function handleAddWish(e) {
      e.preventDefault();

      const name = document.getElementById('productName').value.trim();
      const category = document.getElementById('productCategory').value;
      const price = parseFloat(document.getElementById('productPrice').value) || 0;

      if (!name) return;

      const newWish = {
        id: Date.now().toString(),
        name,
        category,
        price,
        completed: false,
        createdAt: new Date().toISOString()
      };

      wishes.unshift(newWish);
      saveToStorage();
      renderWishes();

      wishForm.reset();
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));
    }

    function renderWishes() {
      const selectedCategory = filterCategory.value;
      wishList.innerHTML = '';

      let filteredWishes = wishes;
      if (selectedCategory !== 'all') {
        filteredWishes = wishes.filter(w => w.category === selectedCategory);
      }

      updateStats(filteredWishes);

      if (filteredWishes.length === 0) {
        wishList.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-moon"></i>
            <p>Nenhum desejo consagrado ainda.</p>
          </div>
        `;
        return;
      }

      filteredWishes.forEach(wish => {
        const card = document.createElement('div');
        card.className = `wish-card ${wish.completed ? 'completed' : ''}`;
        
        const priceFormatted = wish.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        card.innerHTML = `
          <div>
            <div class="card-header">
              <h3 class="wish-title">${escapeHTML(wish.name)}</h3>
              <span class="category-badge">${wish.category}</span>
            </div>
            <div class="price-tag">${priceFormatted}</div>
          </div>

          <div class="card-actions">
            <button class="action-btn check" onclick="toggleComplete('${wish.id}')" title="Marcar como Realizado">
              <i class="fa-solid ${wish.completed ? 'fa-circle-check' : 'fa-circle'}"></i>
              <span>${wish.completed ? 'Realizado' : 'Conquistar'}</span>
            </button>
            <div class="btn-action-group">
              <button class="action-btn edit" onclick="openEditModal('${wish.id}')" title="Editar produto">
                <i class="fa-solid fa-pencil"></i>
              </button>
              <button class="action-btn delete" onclick="deleteWish('${wish.id}')" title="Excluir produto">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;

        wishList.appendChild(card);
      });
    }

    function updateStats(items) {
      totalItemsEl.textContent = items.length;
      const sum = items.reduce((acc, curr) => acc + (curr.price || 0), 0);
      totalValueEl.textContent = sum.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    window.toggleComplete = function(id) {
      wishes = wishes.map(wish => {
        if (wish.id === id) {
          return { ...wish, completed: !wish.completed };
        }
        return wish;
      });
      saveToStorage();
      renderWishes();
    };

    window.deleteWish = function(id) {
      if (confirm('Deseja realmente remover este desejo do seu grimório?')) {
        wishes = wishes.filter(wish => wish.id !== id);
        saveToStorage();
        renderWishes();
      }
    };

    window.openEditModal = function(id) {
      const wish = wishes.find(w => w.id === id);
      if (!wish) return;

      document.getElementById('editId').value = wish.id;
      document.getElementById('editProductName').value = wish.name;
      document.getElementById('editProductCategory').value = wish.category;
      document.getElementById('editProductPrice').value = wish.price || '';

      editModal.classList.add('active');
    };

    function hideModal() {
      editModal.classList.remove('active');
    }

    function handleEditSave(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const name = document.getElementById('editProductName').value.trim();
      const category = document.getElementById('editProductCategory').value;
      const price = parseFloat(document.getElementById('editProductPrice').value) || 0;

      if (!name) return;

      wishes = wishes.map(wish => {
        if (wish.id === id) {
          return { ...wish, name, category, price };
        }
        return wish;
      });

      saveToStorage();
      renderWishes();
      hideModal();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>

</body>
</html>
